<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="tools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <!-- Wrench -->
  <g transform="translate(14, 14)" filter="url(#glow)">
    <path d="M20 4L16 8l-4 4-4-4 4-4 4 4zM4 20l4 4 12-12-4-4-12 12z" fill="url(#tools)"/>
    <path d="M28 12l-4 4-4-4 4-4 4 4z" fill="url(#tools)" opacity="0.7"/>
  </g>
  <!-- Screwdriver -->
  <g transform="translate(30, 30)" filter="url(#glow)">
    <path d="M16 4L12 8l-4 4-4-4 4-4 4 4zM0 20l4 4 8-8-4-4-8 8z" fill="#f97316"/>
    <path d="M24 4l-4 4-4-4 4-4 4 4z" fill="#fb923c" opacity="0.7"/>
  </g>
  <!-- Circular progress indicator -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="150.8" stroke-dashoffset="45" stroke-linecap="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="150.8;0;150.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>